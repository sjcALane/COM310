<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracing fork()</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="../../">COM310</a> / <a href="../">Processes</a></div>
  <h1>Tracing <code>fork()</code></h1>

  <section class="block" id="trace">
    <h2>Watch and trace the code</h2>
    <div class="sync">
      <div class="code" data-role="code" aria-label="Program"></div>
      <div class="stage" data-role="stage"></div>
    </div>
    <div>
      <div class="out-label">Screen output</div>
      <div class="out" data-role="out"></div>
    </div>
    <p class="cap" data-role="cap" aria-live="polite"></p>
    <div class="bar">
      <button data-role="back">Back</button>
      <button data-role="next" class="primary">Play</button>
      <button data-role="replay">Replay</button>
      <button data-role="reset">Start over</button>
      <span class="count" data-role="count"></span>
    </div>
    <details class="more">
      <summary>Show what each process holds at this step</summary>
      <div class="panels" data-role="panels"></div>
    </details>
  </section>

  <div class="hint">You can also use the arrow keys or the space bar.</div>
  <div class="files">C code: <a href="fork_demo.c">fork_demo.c</a></div>
</div>

<script src="../../assets/demo.js"></script>
<script>
function parent(f, x, st, hot) {
  return { title: 'Parent', tag: 'P', rows: [
    ['Real ID (getpid)', '1000'], ['forkreturn', f, hot === 'f'], ['x', x, hot === 'x'], ['State', st]
  ] };
}
function child(f, x, st, hot) {
  return { title: 'Child', tag: 'C', rows: [
    ['Real ID (getpid)', '1001'], ['forkreturn', f, hot === 'f'], ['x', x, hot === 'x'], ['State', st]
  ] };
}
var noChild = { title: 'Child', tag: 'C', gone: "Doesn't exist right now" };

Stepper({
  root: 'trace',
  clips: true,
  tags: { P: 'solid', C: 'outline' },
  code: [
    'x = 10',
    'print "Before fork"',
    'forkreturn = fork()',
    'if forkreturn == 0:',
    '    x = x + 5',
    '    print "Child: x =", x',
    '    exit()',
    'else:',
    '    wait()',
    '    print "Parent: x =", x'
  ],
  steps: [
    { clip: 1, at: [{ line: 0, tag: 'P' }], panels: [parent('not set yet', '10', 'running'), noChild], out: [],
      text: 'Only one process exists so far, the parent. The OS gave it ID 1000. It sets x to 10.' },
    { at: [{ line: 1, tag: 'P' }], panels: [parent('not set yet', '10', 'running'), noChild], out: ['Before fork'],
      text: 'The parent prints. There is still just one process.' },
    { clip: 2, at: [{ line: 2, tag: 'P' }, { line: 2, tag: 'C' }], panels: [parent('1001', '10', 'running', 'f'), child('0', '10', 'running', 'f')], out: ['Before fork'],
      text: 'fork() copies the whole process. The copy is the child, and the OS gives it ID 1001. Now fork returns in both. The parent gets 1001, its child\'s ID. The child gets 0, which means "you\'re the copy."' },
    { at: [{ line: 3, tag: 'P' }, { line: 3, tag: 'C' }], panels: [parent('1001', '10', 'running'), child('0', '10', 'running')], out: ['Before fork'],
      text: 'Both processes run the same if statement, but their forkreturn values are different. The parent has 1001, so it goes to else. The child has 0, so it goes into the if.' },
    { clip: 3, at: [{ line: 8, tag: 'P' }, { line: 4, tag: 'C' }], panels: [parent('1001', '10', 'waiting', 'x'), child('0', '15', 'running', 'x')], out: ['Before fork'],
      text: 'The parent calls wait() and sleeps until the child finishes. The child changes x to 15, but only in its own copy. The parent\'s x is still 10.' },
    { at: [{ line: 8, tag: 'P' }, { line: 5, tag: 'C' }], panels: [parent('1001', '10', 'waiting'), child('0', '15', 'running')], out: ['Before fork', 'Child: x = 15'],
      text: 'The child prints its x.' },
    { clip: 4, at: [{ line: 8, tag: 'P' }, { line: 6, tag: 'C' }], panels: [parent('1001', '10', 'waking up'), child('0', '15', 'finished')], out: ['Before fork', 'Child: x = 15'],
      text: 'The child calls exit() and is done. The OS tells the parent that its child finished, so the parent wakes up.' },
    { clip: 5, at: [{ line: 9, tag: 'P' }], panels: [parent('1001', '10', 'running', 'x'), noChild], out: ['Before fork', 'Child: x = 15', 'Parent: x = 10'],
      text: 'The parent prints its x, which is still 10. Two processes means two separate copies of every variable.' }
  ]
});
</script>
</body>
</html>
