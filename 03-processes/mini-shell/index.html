<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A tiny shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="../../">COM310</a> / <a href="../">Processes</a></div>
  <h1>A tiny shell</h1>

  <section class="block" id="figure">
    <h2>See it on a timeline</h2>
    <div class="fig">
      <svg viewBox="0 0 1000 330" role="img" aria-label="Timeline of a shell running two commands, each in a new child process">
        <text x="20" y="64">Shell 1000</text>
        <text x="20" y="164">Child 1001</text>
        <text x="20" y="264">Child 1002</text>
        <line class="run" x1="150" y1="58" x2="270" y2="58"/>
        <line class="wait" x1="270" y1="58" x2="460" y2="58"/>
        <line class="run" x1="460" y1="58" x2="590" y2="58"/>
        <line class="wait" x1="590" y1="58" x2="780" y2="58"/>
        <line class="run" x1="780" y1="58" x2="900" y2="58"/>
        <circle class="end" cx="900" cy="58" r="6"/>
        <text x="160" y="40" class="note mono">mysh&gt; date</text>
        <text x="470" y="40" class="note mono">mysh&gt; ls</text>
        <text x="790" y="40" class="note mono">mysh&gt; exit</text>
        <line class="tick" x1="270" y1="30" x2="270" y2="180"/>
        <line class="tick" x1="590" y1="30" x2="590" y2="280"/>
        <text x="280" y="88" class="note mono">fork()</text>
        <text x="600" y="88" class="note mono">fork()</text>
        <line class="run" x1="270" y1="158" x2="460" y2="158"/>
        <circle class="end" cx="460" cy="158" r="6"/>
        <text x="280" y="190" class="note mono">exec("date")</text>
        <text x="470" y="164" class="note">exits</text>
        <line class="run" x1="590" y1="258" x2="780" y2="258"/>
        <circle class="end" cx="780" cy="258" r="6"/>
        <text x="600" y="290" class="note mono">exec("ls")</text>
        <text x="790" y="264" class="note">exits</text>
        <line class="run" x1="150" y1="318" x2="200" y2="318"/><text x="210" y="324" class="note">running</text>
        <line class="wait" x1="320" y1="318" x2="370" y2="318"/><text x="380" y="324" class="note">waiting in wait()</text>
      </svg>
    </div>
    <p class="cap">Every command gets its own new child with a new ID. The shell waits while that child runs, then prints the next prompt.</p>
  </section>

  <section class="block" id="trace">
    <h2>Trace the code</h2>
    <div class="grid">
      <div class="code" data-role="code" aria-label="Program"></div>
      <div class="panels" data-role="panels"></div>
    </div>
    <div>
      <div class="out-label">Screen output</div>
      <div class="out" data-role="out"></div>
    </div>
    <p class="cap" data-role="cap" aria-live="polite"></p>
    <div class="bar">
      <button data-role="back">Back</button>
      <button data-role="next" class="primary">Next</button>
      <button data-role="reset">Start over</button>
      <span class="count" data-role="count"></span>
    </div>
  </section>

  <div class="hint">You can also use the arrow keys or the space bar.</div>
  <div class="files">C code: <a href="mini_shell.c">mini_shell.c</a></div>
</div>

<script src="../../assets/demo.js"></script>
<script>
function shell(f, st) {
  return { title: 'Shell', tag: 'S', rows: [['Real ID', '1000'], ['forkreturn', f], ['Program', 'mini_shell'], ['State', st]] };
}
function child(prog, st, hot) {
  return { title: 'Child', tag: 'C', rows: [['Real ID', '1001'], ['forkreturn', '0'], ['Program', prog, hot], ['State', st]] };
}
var noChild = { title: 'Child', tag: 'C', gone: "Doesn't exist right now" };
var DATE = 'Fri Oct 23 16:45:12 EDT 2026';

Stepper({
  root: 'trace',
  tags: { S: 'solid', C: 'outline' },
  code: [
    'loop forever:',
    '    print "mysh> "',
    '    command = read a line',
    '    if command is "exit": stop',
    '    forkreturn = fork()',
    '    if forkreturn == 0:',
    '        exec(command)',
    '    else:',
    '        wait()'
  ],
  steps: [
    { at: [{ line: 1, tag: 'S' }], panels: [shell('not set yet', 'running'), noChild], out: ['mysh> '],
      text: `The shell prints a prompt.` },
    { at: [{ line: 2, tag: 'S' }], panels: [shell('not set yet', 'waiting for you to type'), noChild], out: ['mysh> date'],
      text: `The shell waits for a command. You type date and press Enter.` },
    { at: [{ line: 3, tag: 'S' }], panels: [shell('not set yet', 'running'), noChild], out: ['mysh> date'],
      text: `The command isn't exit, so the shell keeps going.` },
    { at: [{ line: 4, tag: 'S' }, { line: 4, tag: 'C' }], panels: [shell('1001', 'running'), child('mini_shell (a copy)', 'running')], out: ['mysh> date'],
      text: `The shell forks. Now there's a copy of the shell, process 1001.` },
    { at: [{ line: 8, tag: 'S' }, { line: 6, tag: 'C' }], panels: [shell('1001', 'waiting'), child('date', 'running', true)], out: ['mysh> date'],
      text: `The shell waits. The child calls exec("date") and turns into the date program.` },
    { at: [{ line: 8, tag: 'S' }], panels: [shell('1001', 'waiting'), child('date', 'running')], out: ['mysh> date', DATE],
      text: `date prints the date and time.` },
    { at: [{ line: 8, tag: 'S' }], panels: [shell('1001', 'waking up'), child('date', 'finished')], out: ['mysh> date', DATE],
      text: `date exits, and the shell wakes up.` },
    { at: [{ line: 1, tag: 'S' }], panels: [shell('1001', 'running'), noChild], out: ['mysh> date', DATE, 'mysh> '],
      text: `Back to the top of the loop for a new prompt. Another command would get a brand-new child with a new ID, like 1002.` },
    { at: [{ line: 3, tag: 'S' }], panels: [shell('1001', 'finished'), noChild], out: ['mysh> date', DATE, 'mysh> exit'],
      text: `You type exit, so the shell leaves the loop and ends. bash does the same thing every time you press Enter, with a lot more features on top.` }
  ]
});
</script>
</body>
</html>
