<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exec() replaces the program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="../../">COM310</a> / <a href="../">Processes</a></div>
  <h1><code>exec()</code> replaces the program</h1>

  <section class="block" id="trace">
    <h2>Watch and trace the code</h2>
    <div class="sync">
      <div class="code" data-role="code" aria-label="Program"></div>
      <div class="stage" data-role="stage"></div>
    </div>
    <div>
      <div class="out-label">Screen output</div>
      <div class="out" data-role="out"></div>
    </div>
    <p class="cap" data-role="cap" aria-live="polite"></p>
    <div class="bar">
      <button data-role="back">Back</button>
      <button data-role="next" class="primary">Play</button>
      <button data-role="replay">Replay</button>
      <button data-role="reset">Start over</button>
      <span class="count" data-role="count"></span>
    </div>
    <details class="more">
      <summary>Show what each process holds at this step</summary>
      <div class="panels" data-role="panels"></div>
    </details>
  </section>

  <div class="hint">You can also use the arrow keys or the space bar.</div>
  <div class="files">C code: <a href="exec_replace.c">exec_replace.c</a></div>
</div>

<script src="../../assets/demo.js"></script>
<script>
function proc(prog, st, hot) {
  return { title: 'Process 1000', tag: 'P', rows: [['Program', prog, hot], ['State', st]] };
}
var L1 = "I am process 1000 and I'm about to run ps";

Stepper({
  root: 'trace',
  clips: true,
  tags: { P: 'solid' },
  code: [
    'print "I am process", my_id',
    'exec("ps", my_id)',
    'print "This line never prints"'
  ],
  steps: [
    { clip: 1, at: [{ line: 0, tag: 'P' }], panels: [proc('exec_replace', 'running')], out: [L1],
      text: `One process, ID 1000, running our program. It prints its ID.` },
    { clip: 2, at: [{ line: 1, tag: 'P' }], panels: [proc('nothing yet', 'running', true)], out: [L1],
      text: `exec() doesn't make a new process. It throws away this process's code and variables, but the process and its ID stay.` },
    { clip: 3, at: [], panels: [proc('ps', 'running', true)], out: [L1, '  PID COMMAND', ' 1000 ps'],
      text: `The OS loads ps from disk into the same process and runs it. ps reports on process 1000 and shows it's now running ps. Same process, different program.` },
    { clip: 4, at: [], panels: [proc('ps', 'finished')], out: [L1, '  PID COMMAND', ' 1000 ps'],
      text: `When ps finishes, the process ends. The last line of our program never ran, because our program was gone the moment exec() worked. exec() only comes back if it fails.` }
  ]
});
</script>
</body>
</html>
