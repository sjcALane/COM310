<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two forks, four processes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="../../">COM310</a> / <a href="../">Processes</a></div>
  <h1>Two forks, four processes</h1>

  <div class="grid">
    <div class="code" id="code" aria-label="Program"></div>
    <div class="panels" id="panels"></div>
  </div>

  <div>
    <div class="out-label">Screen output</div>
    <div class="out" id="out"></div>
  </div>

  <p class="cap" id="cap" aria-live="polite"></p>

  <div class="bar">
    <button id="back">Back</button>
    <button id="next" class="primary">Next</button>
    <button id="reset">Start over</button>
    <span class="count" id="cnt"></span>
  </div>
  <div class="hint">You can also use the arrow keys or the space bar.</div>
  <div class="files">C code: <a href="fork_twice.c">fork_twice.c</a></div>
</div>

<script src="../../assets/stepper.js"></script>
<script>
function proc(name, tag, id, parent, made) {
  return { title: 'Process ' + name, tag: tag, rows: [['Real ID', id], ['Parent', parent], ['Made by', made]] };
}
function gone(name, tag) { return { title: 'Process ' + name, tag: tag, gone: "Doesn't exist yet" }; }
var A = proc('A', 'A', '1000', '900 (shell)', 'the shell');
var B = proc('B', 'B', '1001', '1000', 'A, 1st fork');
var C = proc('C', 'C', '1002', '1000', 'A, 2nd fork');
var D = proc('D', 'D', '1003', '1001', 'B, 2nd fork');

Stepper({
  tags: { A: 'solid', B: 'outline', C: 'dashed', D: 'double' },
  panelColumns: 2,
  code: [
    'fork()',
    'fork()',
    'print "hello from", my_id, parent_id'
  ],
  steps: [
    { at: [{ line: 0, tag: 'A' }], panels: [A, gone('B', 'B'), gone('C', 'C'), gone('D', 'D')], out: [],
      text: `There's one process, A. It's about to call fork() for the first time.` },
    { at: [{ line: 1, tag: 'A' }, { line: 1, tag: 'B' }], panels: [A, B, gone('C', 'C'), gone('D', 'D')], out: [],
      text: `The first fork() copies A to make B. Both are now on the second line, and both are about to call fork().` },
    { at: [{ line: 2, tag: 'A' }, { line: 2, tag: 'B' }, { line: 2, tag: 'C' }, { line: 2, tag: 'D' }], panels: [A, B, C, D], out: [],
      text: `Both A and B call fork(). A makes C, and B makes D. That's four processes, and all four are on the print line.` },
    { at: [], panels: [A, B, C, D],
      out: ['hello from process 1002, my parent is 1000', 'hello from process 1003, my parent is 1001', 'hello from process 1001, my parent is 1000', 'hello from process 1000, my parent is 900'],
      text: `All four print. The order can change from run to run, because the scheduler decides who goes first.` },
    { at: [], panels: [A, B, C, D],
      out: ['hello from process 1002, my parent is 1000', 'hello from process 1003, my parent is 1001', 'hello from process 1001, my parent is 1000', 'hello from process 1000, my parent is 900'],
      text: `Use the parent IDs to draw the family tree. A is the parent of B and C, and B is the parent of D. Every fork() doubles the count, so 2 forks make 4 processes and 3 forks would make 8.` }
  ]
});
</script>
</body>
</html>
