<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two forks, four processes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="../../">COM310</a> / <a href="../">Processes</a></div>
  <h1>Two forks, four processes</h1>

  <section class="block" id="trace">
    <h2>Watch and trace the code</h2>
    <div class="sync">
      <div class="code" data-role="code" aria-label="Program"></div>
      <div class="stage" data-role="stage"></div>
    </div>
    <div>
      <div class="out-label">Screen output</div>
      <div class="out" data-role="out"></div>
    </div>
    <p class="cap" data-role="cap" aria-live="polite"></p>
    <div class="bar">
      <button data-role="back">Back</button>
      <button data-role="next" class="primary">Play</button>
      <button data-role="replay">Replay</button>
      <button data-role="reset">Start over</button>
      <span class="count" data-role="count"></span>
    </div>
    <details class="more">
      <summary>Show what each process holds at this step</summary>
      <div class="panels" data-role="panels"></div>
    </details>
  </section>

  <div class="hint">You can also use the arrow keys or the space bar.</div>
  <div class="files">C code: <a href="fork_twice.c">fork_twice.c</a></div>
</div>

<script src="../../assets/demo.js"></script>
<script>
function proc(id, parent, made) {
  return { title: 'Process ' + id, rows: [['Parent', parent], ['Made by', made]] };
}
var P1000 = proc('1000', '900 (the shell)', 'the shell');
var P1001 = proc('1001', '1000', "1000's first fork");
var P1002 = proc('1002', '1000', "1000's second fork");
var P1003 = proc('1003', '1001', "1001's second fork");
var OUT = ['hello from process 1002, my parent is 1000', 'hello from process 1003, my parent is 1001',
           'hello from process 1001, my parent is 1000', 'hello from process 1000, my parent is 900'];

Stepper({
  root: 'trace',
  clips: true,
  panelColumns: 2,
  code: [
    'fork()',
    'fork()',
    'print "hello from", my_id, parent_id'
  ],
  steps: [
    { clip: 1, at: [{ line: 0 }], panels: [P1000], out: [],
      text: `In the animation, time runs left to right and each line is a process. We start with one process, 1000, about to call fork().` },
    { clip: 2, at: [{ line: 1 }], panels: [P1000, P1001], out: [],
      text: `The first fork() copies 1000 to make 1001. Both are now on the second line, and both are about to call fork().` },
    { clip: 3, at: [{ line: 2 }], panels: [P1000, P1001, P1002, P1003], out: OUT,
      text: `Both call fork(), so each one makes a child. 1000 makes 1002, and 1001 makes 1003. All four print, which is why the program prints 4 lines. The order can change from run to run.` },
    { clip: 4, at: [], panels: [P1000, P1001, P1002, P1003], out: OUT,
      text: `A third fork() would double the count again to 8. Every fork() doubles it, so n forks make 2ⁿ processes.` }
  ]
});
</script>
</body>
</html>
