<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Tracing fork()</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: projector-first two-pane stepper. Code on the left, the two processes on the right, explanation and controls underneath. Plain black and white. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #5a5a5a;
  --line: #c9c9c9;
  --soft: #f2f2f2;
  --inv-bg: #111111;
  --inv-fg: #ffffff;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0f; --fg: #f2f2f2; --muted: #a8a8a8; --line: #444444; --soft: #1c1c1c;
    --inv-bg: #f2f2f2; --inv-fg: #0f0f0f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0f; --fg: #f2f2f2; --muted: #a8a8a8; --line: #444444; --soft: #1c1c1c;
  --inv-bg: #f2f2f2; --inv-fg: #0f0f0f; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 18px; line-height: 1.5;
}
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
h1 { font-size: 30px; font-weight: 600; margin: 0; text-wrap: balance; }
h1 code { font-family: var(--mono); }
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.code { border: 1.5px solid var(--fg); border-radius: 6px; padding: 10px 0; overflow-x: auto; }
.ln { display: flex; align-items: center; font-family: var(--mono); font-size: 22px; padding: 4px 14px; white-space: pre; }
.ln.on { background: var(--soft); font-weight: 600; }
.marks { width: 80px; flex-shrink: 0; display: flex; gap: 6px; }
.tag { font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 1px 8px; border-radius: 4px; line-height: 1.5; }
.tag.p { background: var(--inv-bg); color: var(--inv-fg); border: 1.5px solid var(--inv-bg); }
.tag.c { background: var(--bg); color: var(--fg); border: 1.5px solid var(--fg); }
.procs { display: flex; flex-direction: column; gap: 16px; }
.proc { border: 1.5px solid var(--fg); border-radius: 6px; padding: 14px 18px; }
.proc.gone { border-style: dashed; border-color: var(--line); color: var(--muted); }
.proc h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.kv { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 18px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.kv .hot { border-bottom: 2px solid var(--fg); }
.out-label { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.out { font-family: var(--mono); font-size: 20px; background: var(--soft); border-radius: 6px; padding: 12px 16px; min-height: 34px; }
.cap { font-size: 22px; line-height: 1.55; max-width: 62ch; margin: 0; min-height: 3.2em; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
button {
  font-family: var(--sans); font-size: 18px; font-weight: 600; padding: 10px 20px;
  border: 1.5px solid var(--fg); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer;
}
button.primary { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
button:disabled { opacity: 0.4; cursor: default; }
.count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <h1>Tracing <code>fork()</code></h1>

  <div class="grid">
    <div class="code" id="code" aria-label="Program"></div>
    <div class="procs">
      <section class="proc" id="pbox"></section>
      <section class="proc" id="cbox"></section>
    </div>
  </div>

  <div>
    <div class="out-label">Screen output</div>
    <div class="out" id="out"></div>
  </div>

  <p class="cap" id="cap" aria-live="polite"></p>

  <div class="bar">
    <button id="back">Back</button>
    <button id="next" class="primary">Next</button>
    <button id="reset">Start over</button>
    <span class="count" id="cnt"></span>
  </div>
  <div class="hint">You can also use the arrow keys or the space bar.</div>
</div>

<script>
const code = [
  'x = 10',
  'print "Before fork"',
  'forkreturn = fork()',
  'if forkreturn == 0:',
  '    x = x + 5',
  '    print "Child: x =", x',
  '    exit()',
  'else:',
  '    wait()',
  '    print "Parent: x =", x'
];

const steps = [
  { p: 0, c: null, P: { x: '10', f: 'not set yet', st: 'running' }, C: null, out: [],
    t: 'Only one process exists so far, the parent. The OS gave it ID 1000. It sets x to 10.' },
  { p: 1, c: null, P: { x: '10', f: 'not set yet', st: 'running' }, C: null, out: ['Before fork'],
    t: 'The parent prints. There is still just one process.' },
  { p: 2, c: 2, P: { x: '10', f: '1001', st: 'running' }, C: { x: '10', f: '0', st: 'running' }, out: ['Before fork'], hot: 'f',
    t: 'fork() copies the whole process. The copy is the child, and the OS gives it ID 1001. Now fork returns in both. The parent gets 1001, its child\'s ID. The child gets 0, which means "you\'re the copy."' },
  { p: 3, c: 3, P: { x: '10', f: '1001', st: 'running' }, C: { x: '10', f: '0', st: 'running' }, out: ['Before fork'],
    t: 'Both processes run the same if statement, but their forkreturn values are different. The parent has 1001, so it goes to else. The child has 0, so it goes into the if.' },
  { p: 8, c: 4, P: { x: '10', f: '1001', st: 'waiting' }, C: { x: '15', f: '0', st: 'running' }, out: ['Before fork'], hot: 'x',
    t: 'The parent calls wait() and sleeps until the child finishes. The child changes x to 15, but only in its own copy. The parent\'s x is still 10.' },
  { p: 8, c: 5, P: { x: '10', f: '1001', st: 'waiting' }, C: { x: '15', f: '0', st: 'running' }, out: ['Before fork', 'Child: x = 15'],
    t: 'The child prints its x.' },
  { p: 8, c: 6, P: { x: '10', f: '1001', st: 'waking up' }, C: { x: '15', f: '0', st: 'finished' }, out: ['Before fork', 'Child: x = 15'],
    t: 'The child calls exit() and is done. The OS tells the parent that its child finished, so the parent wakes up.' },
  { p: 9, c: null, P: { x: '10', f: '1001', st: 'running' }, C: null, out: ['Before fork', 'Child: x = 15', 'Parent: x = 10'], hot: 'x',
    t: 'The parent prints its x, which is still 10. Two processes means two separate copies of every variable.' }
];

let i = 0;
const $ = id => document.getElementById(id);

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function procHTML(name, id, cls, d, hot) {
  const head = '<h2><span class="tag ' + cls + '">' + name[0] + '</span>' + name + '</h2>';
  if (!d) return head + '<div>Doesn\'t exist right now</div>';
  const h = k => (hot === k ? ' class="hot"' : '');
  return head + '<dl class="kv">' +
    '<dt>Real ID (getpid)</dt><dd>' + id + '</dd>' +
    '<dt>forkreturn</dt><dd' + h('f') + '>' + d.f + '</dd>' +
    '<dt>x</dt><dd' + h('x') + '>' + d.x + '</dd>' +
    '<dt>State</dt><dd>' + d.st + '</dd>' +
    '</dl>';
}

function draw() {
  const s = steps[i];
  $('code').innerHTML = code.map((line, n) => {
    const isP = s.p === n, isC = s.c === n;
    let m = '';
    if (isP) m += '<span class="tag p">P</span>';
    if (isC) m += '<span class="tag c">C</span>';
    return '<div class="ln' + (isP || isC ? ' on' : '') + '"><span class="marks">' + m + '</span>' + esc(line) + '</div>';
  }).join('');
  const pb = $('pbox'), cb = $('cbox');
  pb.className = 'proc' + (s.P ? '' : ' gone');
  cb.className = 'proc' + (s.C ? '' : ' gone');
  pb.innerHTML = procHTML('Parent', '1000', 'p', s.P, s.hot);
  cb.innerHTML = procHTML('Child', '1001', 'c', s.C, s.hot);
  $('out').innerHTML = s.out.length ? s.out.map(esc).join('<br>') : '<span style="color:var(--muted)">nothing yet</span>';
  $('cap').textContent = s.t;
  $('cnt').textContent = 'Step ' + (i + 1) + ' of ' + steps.length;
  $('back').disabled = i === 0;
  $('next').disabled = i === steps.length - 1;
}

function go(d) { const n = i + d; if (n >= 0 && n < steps.length) { i = n; draw(); } }
$('next').addEventListener('click', () => go(1));
$('back').addEventListener('click', () => go(-1));
$('reset').addEventListener('click', () => { i = 0; draw(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'Home') { i = 0; draw(); }
});
draw();
</script>
</body>
</html>
